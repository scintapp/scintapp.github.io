<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scint · Thread trace</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<style>
:root {
  color-scheme: dark;
  --ground: #131314;
  --canvas: #1a1a1b;
  --surface: #222225;
  --ink: #f0edef;
  --ink-2: #cfccce;
  --muted: #98969a;
  --faint: #6a686d;
  --line: rgba(240, 237, 239, 0.1);
  --line-strong: rgba(240, 237, 239, 0.24);
  --compose: #c7a3e7;
  --evaluate: #f9b588;
  --process: #f1a3ab;
  --observe: #abe3f3;
  --search: #b7ecbc;
  --display: "Newsreader", "Iowan Old Style", Georgia, serif;
  --body: "Hanken Grotesk", -apple-system, "Helvetica Neue", Arial, sans-serif;
  --data: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --ground: #f5f3f4;
    --canvas: #fbfafb;
    --surface: #ffffff;
    --ink: #1b1a1c;
    --ink-2: #3a383c;
    --muted: #6b686e;
    --faint: #98959b;
    --line: rgba(27, 26, 28, 0.11);
    --line-strong: rgba(27, 26, 28, 0.3);
    --compose: #7b52b3;
    --evaluate: #b4601f;
    --process: #b24553;
    --observe: #1c7c96;
    --search: #2c7f45;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --ground: #f5f3f4;
  --canvas: #fbfafb;
  --surface: #ffffff;
  --ink: #1b1a1c;
  --ink-2: #3a383c;
  --muted: #6b686e;
  --faint: #98959b;
  --line: rgba(27, 26, 28, 0.11);
  --line-strong: rgba(27, 26, 28, 0.3);
  --compose: #7b52b3;
  --evaluate: #b4601f;
  --process: #b24553;
  --observe: #1c7c96;
  --search: #2c7f45;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1060px; margin-inline: auto; padding: clamp(24px, 5vw, 56px) clamp(16px, 4vw, 40px); }
.label { display: flex; align-items: center; gap: 9px; font-family: var(--data); font-size: 12px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.glyph { width: 11px; height: 11px; border: 1.5px solid currentColor; border-radius: 3.5px; flex: none; }
figure { margin: 0; display: flex; flex-direction: column; gap: 14px; }
figcaption { font-size: 14.5px; line-height: 1.5; color: var(--muted); max-width: 70ch; }
.panel { background: var(--canvas); border: 1px solid var(--line); border-radius: 20px; padding: clamp(16px, 3vw, 28px); display: flex; flex-direction: column; gap: 22px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 14px; color: var(--ink-2); }
.legend span { display: flex; align-items: center; gap: 7px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--hue, var(--muted)); flex: none; }
.dot.input { background: var(--canvas); border: 1.5px solid var(--ink); }
.dot.output { background: var(--ink); }
.h-compose { --hue: var(--compose); }
.h-evaluate { --hue: var(--evaluate); }
.h-process { --hue: var(--process); }
.back { margin: 0 0 20px; font-size: 15px; }
.back a { color: var(--muted); text-decoration: none; }
.back a:hover { color: var(--ink); }
.h-observe { --hue: var(--observe); }
.h-search { --hue: var(--search); }
.trace { display: block; width: 100%; height: auto; cursor: crosshair; touch-action: pan-y; }
.trace text { font-family: var(--body); font-size: 14px; fill: var(--ink-2); }
.trace g[data-root] { transition: opacity 0.12s; }
.readout { font-family: var(--data); font-size: 12.5px; color: var(--muted); min-height: 20px; }
</style>
</head>
<body>
<div class="wrap">
  <p class="back"><a href="index.html">← Scint case study</a></p>
  <figure>
    <div class="label"><span class="glyph"></span>A retired structure, encoded</div>
    <div class="panel">
      <div class="legend">
        <span><i class="dot h-compose"></i>Compose</span>
        <span><i class="dot h-evaluate"></i>Evaluate</span>
        <span><i class="dot h-process"></i>Process</span>
        <span><i class="dot h-observe"></i>Observe</span>
        <span><i class="dot h-search"></i>Search</span>
        <span><i class="dot input"></i>Input</span>
        <span><i class="dot output"></i>Output</span>
      </div>
      <svg id="trace" class="trace" viewBox="0 0 980 372" role="img" aria-label="Seven horizontal threads, one per space, running left to right through time. Each thread carries its own inputs and outputs. Ticks beneath a thread are its activity, coloured by intent. Curves show an input or output crossing from one thread to another."></svg>
      <div id="readout" class="readout" aria-live="polite"></div>
    </div>
    <figcaption>Seven spaces with the tree removed. Each line is one space's thread of inputs and outputs. The ticks under it are that space's activity, so a change of intent is a change of colour on the same line. A curve is an input or an output crossing to another thread. Illustrative data.</figcaption>
  </figure>
</div>
<script>
(function () {
  var NS = 'http://www.w3.org/2000/svg'
  var svg = document.getElementById('trace')
  var readout = document.getElementById('readout')
  var idle = 'Point at the trace to isolate one root input and everything it caused.'
  var W = 980, gutter = 118, lane = 50, top = 24, right = 10
  var intents = ['compose', 'evaluate', 'process', 'observe', 'search']
  var spaces = {
    obs: { lane: 0, intent: 'observe', spaces: ['dis', 'com'], name: 'Observe' },
    dis: { lane: 1, intent: 'evaluate', spaces: [], name: 'Evaluate' },
    com: { lane: 2, intent: 'compose', spaces: ['ev1', 'ev2'], name: 'Compose' },
    ev1: { lane: 3, intent: 'process', spaces: ['di2', 'sea'], name: 'Process' },
    di2: { lane: 4, intent: 'evaluate', spaces: [], name: 'Evaluate' },
    sea: { lane: 5, intent: 'search', spaces: [], name: 'Search' },
    ev2: { lane: 6, intent: 'process', spaces: [], name: 'Process' }
  }

  var seed = 11
  function random() {
    seed |= 0
    seed = seed + 0x6D2B79F5 | 0
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed)
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t
    return ((t ^ t >>> 14) >>> 0) / 4294967296
  }

  var events = [], roots = []
  function activity(space, t, count, root) {
    for (var i = 0; i < count; i++) {
      var intent = random() < 0.68 ? space.intent : intents[Math.floor(random() * 5)]
      events.push({ kind: 'activity', lane: space.lane, t: t, intent: intent, root: root })
      t++
    }
    return t
  }
  function run(id, t, root) {
    var space = spaces[id]
    events.push({ kind: 'input', lane: space.lane, t: t, root: root })
    t = activity(space, t + 1, 2 + Math.floor(random() * 5), root)
    var children = space.spaces.filter(function () { return random() < 0.85 })
    if (children.length) {
      var end = t
      children.forEach(function (child, index) {
        var start = t + index
        events.push({ kind: 'cross', lane: space.lane, to: spaces[child].lane, t: start, until: start + 1, root: root })
        var finished = run(child, start + 1, root)
        events.push({ kind: 'cross', lane: spaces[child].lane, to: space.lane, t: finished, until: finished + 1, root: root })
        end = Math.max(end, finished + 1)
      })
      t = activity(space, end, 1 + Math.floor(random() * 3), root)
    }
    events.push({ kind: 'output', lane: space.lane, t: t, root: root })
    return t
  }

  var clock = 0
  for (var root = 0; root < 9; root++) {
    var start = clock
    clock = run('obs', clock, root)
    roots.push([start, clock])
    clock += 3 + Math.floor(random() * 4)
  }
  var total = clock

  function x(t) { return gutter + t / total * (W - gutter - right) }
  function y(index) { return top + index * lane }
  function add(name, attributes, parent) {
    var node = document.createElementNS(NS, name)
    for (var key in attributes) node.setAttribute(key, attributes[key])
    ;(parent || svg).appendChild(node)
    return node
  }

  Object.keys(spaces).forEach(function (id) {
    var space = spaces[id]
    add('line', { x1: gutter, x2: W - right, y1: y(space.lane), y2: y(space.lane), style: 'stroke:var(--line-strong);stroke-width:1' })
    add('circle', { cx: 5, cy: y(space.lane), r: 4, style: 'fill:var(--' + space.intent + ')' })
    add('text', { x: 18, y: y(space.lane) + 5 }).textContent = space.name
  })

  var groups = roots.map(function (_, index) { return add('g', { 'data-root': index }) })
  events.forEach(function (event) {
    if (event.kind !== 'cross') return
    var x1 = x(event.t).toFixed(1), x2 = x(event.until).toFixed(1)
    var y1 = y(event.lane), y2 = y(event.to), mid = (y1 + y2) / 2
    add('path', { d: 'M' + x1 + ' ' + y1 + ' C' + x1 + ' ' + mid + ',' + x2 + ' ' + mid + ',' + x2 + ' ' + y2, fill: 'none', style: 'stroke:var(--muted);stroke-width:1;opacity:0.5' }, groups[event.root])
  })
  events.forEach(function (event) {
    var group = groups[event.root], cx = x(event.t), cy = y(event.lane)
    if (event.kind === 'activity') add('rect', { x: (cx - 1.1).toFixed(1), y: cy + 5, width: 2.2, height: 13, rx: 1, style: 'fill:var(--' + event.intent + ')' }, group)
    if (event.kind === 'input') add('circle', { cx: cx.toFixed(1), cy: cy, r: 3.2, style: 'fill:var(--canvas);stroke:var(--ink);stroke-width:1.4' }, group)
    if (event.kind === 'output') add('circle', { cx: cx.toFixed(1), cy: cy, r: 3.2, style: 'fill:var(--ink)' }, group)
  })

  function reset() {
    groups.forEach(function (group) { group.style.opacity = 1 })
    readout.textContent = idle
  }
  function point(pointer) {
    var box = svg.getBoundingClientRect()
    var t = ((pointer.clientX - box.left) / box.width * W - gutter) / (W - gutter - right) * total
    var hit = -1
    roots.forEach(function (range, index) { if (t >= range[0] - 1 && t <= range[1] + 1) hit = index })
    if (hit < 0) return reset()
    groups.forEach(function (group, index) { group.style.opacity = index === hit ? 1 : 0.12 })
    var own = events.filter(function (event) { return event.root === hit })
    var threads = {}
    own.forEach(function (event) { threads[event.lane] = true })
    var activities = own.filter(function (event) { return event.kind === 'activity' }).length
    var crossings = own.filter(function (event) { return event.kind === 'cross' }).length / 2
    readout.textContent = 'Root input ' + (hit + 1) + ' of ' + roots.length + ' · ' + Object.keys(threads).length + ' threads · ' + Math.round(crossings) + ' hand-offs · ' + activities + ' activities'
  }
  svg.addEventListener('pointermove', point)
  svg.addEventListener('pointerleave', reset)
  reset()
})()
</script>
</body>
</html>
